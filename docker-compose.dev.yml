# docker-compose.dev.yml
# $ docker compose -f docker-compose.dev.yml up -d --build

version: "3.9"

name: grindurus-app-dev

networks:
  grindurus:
    external: true

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: app-dev
    restart: unless-stopped
    # node_modules volume replaces image deps; install linux binaries (esbuild, etc.) here
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    environment:
      - TOREADOR_API_TARGET=${TOREADOR_API_TARGET:-http://toreador-api:8010}
      - TOREADOR_API_KEY=${TOREADOR_API_KEY:-}
      - VITE_TOREADOR_API_KEY=${VITE_TOREADOR_API_KEY:-}
    networks:
      - grindurus
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
